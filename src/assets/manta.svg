<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="white">
  <!-- Left wing (top in top-down view) -->
  <path d="M60 36 C52 28, 35 12, 18 6 C10 3, 3 6, 2 14 C1 22, 8 30, 22 35 C36 39, 50 38, 58 38Z" opacity="0.8"/>
  <!-- Right wing (bottom in top-down view) -->
  <path d="M60 44 C52 52, 35 68, 18 74 C10 77, 3 74, 2 66 C1 58, 8 50, 22 45 C36 41, 50 42, 58 42Z" opacity="0.8"/>
  <!-- Wing vein lines -->
  <path d="M55 34 C44 24, 30 14, 18 10" fill="none" stroke="white" stroke-width="0.4" opacity="0.15"/>
  <path d="M50 35 C40 28, 28 18, 16 14" fill="none" stroke="white" stroke-width="0.3" opacity="0.12"/>
  <path d="M55 46 C44 56, 30 66, 18 70" fill="none" stroke="white" stroke-width="0.4" opacity="0.15"/>
  <path d="M50 45 C40 52, 28 62, 16 66" fill="none" stroke="white" stroke-width="0.3" opacity="0.12"/>
  <!-- Central body — elongated diamond -->
  <path d="M72 40 C70 35, 64 33, 56 35 L40 40 L56 45 C64 47, 70 45, 72 40Z" opacity="0.95"/>
  <!-- Body midline -->
  <path d="M72 40 L40 40" fill="none" stroke="white" stroke-width="0.4" opacity="0.15"/>
  <!-- Left cephalic fin (horn) — distinctive manta feature -->
  <path d="M70 36 C74 32, 78 26, 80 22 C81 20, 80 19, 78 20 C76 22, 73 28, 70 34" opacity="0.7"/>
  <!-- Right cephalic fin (horn) -->
  <path d="M70 44 C74 48, 78 54, 80 58 C81 60, 80 61, 78 60 C76 58, 73 52, 70 46" opacity="0.7"/>
  <!-- Mouth (wide slit between horns) -->
  <path d="M71 38 C72 39, 72 41, 71 42" fill="none" stroke="white" stroke-width="0.8" opacity="0.3"/>
  <!-- Gill slits (5 pairs — distinctive ray feature) -->
  <path d="M64 36 L62 37.5" fill="none" stroke="white" stroke-width="0.5" opacity="0.25"/>
  <path d="M62 35.5 L60 37" fill="none" stroke="white" stroke-width="0.5" opacity="0.25"/>
  <path d="M60 35 L58 36.5" fill="none" stroke="white" stroke-width="0.5" opacity="0.25"/>
  <path d="M64 44 L62 42.5" fill="none" stroke="white" stroke-width="0.5" opacity="0.25"/>
  <path d="M62 44.5 L60 43" fill="none" stroke="white" stroke-width="0.5" opacity="0.25"/>
  <path d="M60 45 L58 43.5" fill="none" stroke="white" stroke-width="0.5" opacity="0.25"/>
  <!-- Eyes (on the sides of the head, outside the cephalic fins) -->
  <circle cx="72" cy="34" r="1.4" opacity="0.9"/>
  <circle cx="72" cy="34" r="0.6" fill="black"/>
  <circle cx="72" cy="46" r="1.4" opacity="0.9"/>
  <circle cx="72" cy="46" r="0.6" fill="black"/>
  <!-- Tail — long thin whip -->
  <path d="M40 40 C32 40, 22 39, 10 41 C6 42, 3 41, 1 40" fill="none" stroke="white" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>
  <!-- Clasper-like tail spine -->
  <path d="M18 40 L16 38 M18 40 L16 42" fill="none" stroke="white" stroke-width="0.6" opacity="0.2"/>
</svg>
